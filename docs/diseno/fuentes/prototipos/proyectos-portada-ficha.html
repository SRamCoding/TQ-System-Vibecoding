<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prototipo · Proyectos (portada y ficha)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Prototipo del módulo Proyectos. Estilo del sistema: Inter, superficies blancas, borde fino, esquinas de 12 px.
   Azul noche (primary) y el turquesa del ERP. Datos inventados. */
:root{
  --bg:#F5F6FA; --surface:#fff; --sunk:#F1F3F8; --ink:#18181B; --muted:#6B7280; --line:rgba(9,9,11,.09);
  --primary:#01006F; --erp:#0891B2; --erp-soft:#E0F7FB; --erp-ink:#0E7490;
  --ok:#16A34A; --ok-soft:#DCFCE7; --warn:#D97706; --warn-soft:#FEF3C7; --bad:#DC2626; --bad-soft:#FEE2E2;
  --r:12px; --shadow:0 1px 2px rgba(9,9,11,.05),0 1px 3px rgba(9,9,11,.06);
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:16px;padding:10px 20px;background:#FBFAF8;border-bottom:1px solid var(--line)}
.logo{font-weight:700;letter-spacing:.12em;color:var(--primary)}
.ruta{color:var(--muted);font-size:13px}
.ruta a{color:var(--muted);text-decoration:none;cursor:pointer}
.ruta a:hover{color:var(--primary)}
.demo{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);background:#fff;border:1px dashed #C7C9D9;border-radius:10px;padding:6px 10px}
.demo select{font:inherit;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.wrap{max-width:1360px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}

/* Portada */
.portada{display:grid;grid-template-columns:250px 1fr;gap:20px;margin-top:18px}
.filtros{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;align-self:start;position:sticky;top:64px;box-shadow:var(--shadow)}
.filtros h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.filtros h3:first-child{margin-top:0}
.op{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:8px;cursor:pointer;user-select:none}
.op:hover{background:var(--sunk)}
.op input{accent-color:var(--primary);margin:0}
.op .n{margin-left:auto;font-size:12px;color:var(--muted);background:var(--sunk);border-radius:99px;padding:0 7px}
.op.cero{opacity:.45}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.limpiar{border:0;background:none;color:var(--primary);font-size:12px;padding:0;margin-top:12px}
.barra{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.buscar{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;box-shadow:var(--shadow)}
.buscar input{border:0;outline:0;font:inherit;flex:1}
select.orden{font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--erp-soft);color:var(--erp-ink);border-radius:99px;padding:2px 10px;font-size:12px}
.chip button{border:0;background:none;color:inherit;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(1,0,111,.10)}
.foto{position:relative;aspect-ratio:16/9;background:#dde;overflow:hidden}
.foto img,.foto svg{width:100%;height:100%;object-fit:cover;display:block}
.estado{position:absolute;top:10px;left:10px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.92)}
.sem{position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:rgba(255,255,255,.92)}
.cuerpo{padding:12px 14px 14px}
.cod{font-size:11px;color:var(--muted);letter-spacing:.03em}
.nom{font-weight:600;margin:2px 0;line-height:1.3;min-height:2.6em}
.cli{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barras{margin:10px 0 8px;display:grid;gap:5px}
.b{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:11px;color:var(--muted)}
.track{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px}
.pie{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:9px}
.av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:10px;font-weight:600;flex:none}
.pie .dias{margin-left:auto}
.vacio{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* Ficha */
.hero{position:relative;border-radius:16px;overflow:hidden;min-height:230px;color:#fff;box-shadow:var(--shadow)}
.hero .fondo{position:absolute;inset:0}
.hero .fondo>*{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(1,0,60,.88) 0%,rgba(1,0,60,.65) 45%,rgba(1,0,60,.15) 100%)}
.hero .in{position:relative;z-index:1;padding:26px 28px;display:flex;flex-direction:column;gap:8px;min-height:230px}
.hero h1{font-size:26px;max-width:720px;line-height:1.2}
.hero .meta{display:flex;flex-wrap:wrap;gap:18px;font-size:13px;opacity:.92;margin-top:auto}
.hero .meta b{display:block;font-size:11px;font-weight:500;opacity:.7;text-transform:uppercase;letter-spacing:.05em}
.hero .acc{position:absolute;top:18px;right:18px;z-index:2;display:flex;gap:8px}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:7px 12px;backdrop-filter:blur(6px);display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:rgba(255,255,255,.24)}
.btn.sol{background:#fff;color:var(--primary);border-color:#fff}
.tabs{display:flex;gap:2px;margin:18px 0 16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{border:0;background:none;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--primary);border-color:var(--primary);font-weight:600}
.tab small{font-size:10px;color:var(--erp-ink);background:var(--erp-soft);border-radius:99px;padding:0 6px;margin-left:4px}
.res{display:grid;grid-template-columns:1fr 340px;gap:16px}
.col{display:grid;gap:16px;align-content:start}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.sec h2{font-size:15px;margin:0 0 2px;display:flex;align-items:center;gap:8px}
.sec h2 .q{font-size:11px;font-weight:600;color:var(--erp-ink);background:var(--erp-soft);border-radius:99px;padding:1px 8px}
.sec .exp{color:var(--muted);font-size:12px;margin:0 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px 12px}
.kpi .l{font-size:11px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;letter-spacing:-.01em}
.kpi .d{font-size:11px}
.cas{display:grid;gap:7px}
.cas .row{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:10px;font-size:13px;padding:3px 6px;border-radius:8px;cursor:pointer}
.cas .row:hover{background:var(--sunk)}
.cas .row .t{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.cas .row .f{height:100%;border-radius:4px}
.cas .row .m{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.link{color:var(--primary);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.dos{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:14px}
.mini h4{font-size:12px;margin:0 0 8px;color:var(--muted);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--sunk)}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 8px}
.gantt{position:relative;margin-top:6px}
.gl{display:grid;grid-template-columns:120px 1fr;align-items:center;gap:10px;font-size:12px;height:26px}
.gt{position:relative;height:12px;background:var(--sunk);border-radius:4px}
.gb{position:absolute;top:0;height:100%;border-radius:4px}
.hoy{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--bad)}
.hoyl{position:absolute;top:-20px;transform:translateX(-50%);font-size:10px;color:var(--bad);font-weight:600}
.hitos{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.hito{display:flex;gap:8px;align-items:center;font-size:12.5px}
.rombo{width:10px;height:10px;transform:rotate(45deg);flex:none}
.alerta{display:flex;gap:10px;padding:9px 10px;border-radius:9px;font-size:12.5px;cursor:pointer;margin-bottom:6px}
.alerta:hover{filter:brightness(.97)}
.alerta .i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none;color:#fff}
.alerta small{display:block;color:var(--muted)}
.act{display:flex;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.act:last-child{border:0}
.act small{display:block;color:var(--muted)}
.cobro{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:6px 0 8px}
.cobro div{height:100%}
.ley{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--muted)}
.ley span{display:inline-flex;align-items:center;gap:5px}
.oculto{background:repeating-linear-gradient(45deg,#F4F4F7 0 10px,#EEEEF3 10px 20px);border:1px dashed #C9CAD6;border-radius:var(--r);padding:18px;color:var(--muted);font-size:13px;text-align:center}
.prox{background:var(--surface);border:1px dashed #C9CAD6;border-radius:var(--r);padding:40px;text-align:center;color:var(--muted)}

/* Panel deslizante */
.velo{position:fixed;inset:0;background:rgba(9,9,30,.25);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.velo.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,96vw);background:#fff;z-index:41;transform:translateX(100%);transition:transform .25s ease;box-shadow:-10px 0 40px rgba(0,0,40,.15);display:flex;flex-direction:column}
.panel.on{transform:none}
.panel header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:start;gap:10px}
.panel header h3{margin:0;font-size:16px}
.panel header p{margin:2px 0 0;color:var(--muted);font-size:12px}
.panel .x{margin-left:auto;border:0;background:var(--sunk);border-radius:8px;width:30px;height:30px}
.panel .body{padding:16px 20px;overflow:auto}
.docs td{background:var(--sunk);font-size:12px}
.miga{font-size:12px;color:var(--muted);margin-bottom:10px}
.nota{font-size:11.5px;color:var(--muted);margin-top:10px}
@media (max-width:980px){.portada,.res,.dos{grid-template-columns:1fr}.filtros{position:static}.kpis{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">TECHQUK</span>
  <span class="ruta" id="ruta"></span>
  <label class="demo" title="Solo en el prototipo: para ver cómo cambia la pantalla según quién la mira">
    Ver como
    <select id="rol">
      <option value="jefe">Jefe del proyecto · con permiso de costos</option>
      <option value="gerencia">Gerencia · con permiso de costos</option>
      <option value="sin">Supervisor de obra · sin permiso de costos</option>
    </select>
  </label>
</div>
<div class="wrap" id="app"></div>

<div class="velo" id="velo"></div>
<aside class="panel" id="panel"><header><div><h3 id="pt"></h3><p id="ps"></p></div><button class="x" id="px" aria-label="Cerrar">✕</button></header><div class="body" id="pb"></div></aside>
<input type="file" id="subir" accept="image/*" hidden>

<script>
const HOY = new Date('2026-11-15');
const COLJ = {'Rosa Quispe':'#7C3AED','Diego Salazar':'#0E7490','Andrea Vílchez':'#BE185D','Martín Chávez':'#B45309'};
const ESTADOS = {'En ejecución':['#0E7490','#E0F7FB'],'Por iniciar':['#6B7280','#F1F3F8'],'Cerrado':['#16A34A','#DCFCE7']};
const TIPOS = {T1:'Redes y cableado',T2:'Videovigilancia',T3:'Control de accesos',T4:'Sistemas de control',T5:'Detección de incendios',T6:'Enlaces inalámbricos'};

// Datos inventados. Montos en soles.
const P = [

 {id:18,cod:'PRY-2026-0018',nom:'Control de accesos de la sede central de Agroexport Norte',cli:'Agroexport Norte S.A.C.',niv:'Privado',dep:'La Libertad',tip:'T3',est:'En ejecución',jefe:'Andrea Vílchez',ini:'2026-08-17',fin:'2026-12-31',av:66,C:158400,Pp:124900,Co:98700,G:80300,Py:121600,pc99:0,val:95000,cob:95000,exc:0,gar:[],pal:['#BBF7D0','#15803D']},
 {id:21,cod:'PRY-2026-0021',nom:'Cableado estructurado del Colegio Emblemático Los Algarrobos',cli:'Unidad de Gestión Educativa Local Norte',niv:'Regional',dep:'Piura',tip:'T1',est:'Por iniciar',jefe:'Martín Chávez',ini:'2026-12-01',fin:'2027-03-15',av:0,C:134900,Pp:112300,Co:18400,G:0,Py:112300,pc99:0,val:0,cob:0,exc:0,gar:[['Fiel cumplimiento',13490,'2027-04-14']],pal:['#FBCFE8','#9D174D']},
 {id:9,cod:'PRY-2026-0009',nom:'Centro de control vial de Chiclayo Norte',cli:'Municipalidad Provincial de Chiclayo Norte',niv:'Local',dep:'Lambayeque',tip:'T4',est:'En ejecución',jefe:'Rosa Quispe',ini:'2026-03-02',fin:'2026-12-15',av:79,C:398600,Pp:331700,Co:322400,G:301200,Py:344900,pc99:4120,val:290000,cob:241500,exc:2,gar:[['Fiel cumplimiento',39860,'2026-12-05']],pal:['#C7D2FE','#3730A3']},
 {id:4,cod:'PRY-2026-0004',nom:'Detección de incendios del almacén de Pesquera del Pacífico',cli:'Pesquera del Pacífico S.A.',niv:'Privado',dep:'Áncash',tip:'T5',est:'Cerrado',jefe:'Diego Salazar',ini:'2026-01-12',fin:'2026-06-30',av:100,C:96300,Pp:79800,Co:78150,G:78150,Py:78150,pc99:900,val:96300,cob:96300,exc:0,gar:[],pal:['#FECACA','#B91C1C']},
 {id:24,cod:'PRY-2026-0024',nom:'Enlaces inalámbricos de la Red de Salud Sierra Verde',cli:'Red de Salud Sierra Verde',niv:'Regional',dep:'Cajamarca',tip:'T6',est:'En ejecución',jefe:'Andrea Vílchez',ini:'2026-09-14',fin:'2027-02-26',av:28,C:274500,Pp:226100,Co:121800,G:58600,Py:224900,pc99:0,val:40000,cob:0,exc:0,gar:[['Fiel cumplimiento',27450,'2027-03-28']],pal:['#A5F3FC','#155E75']},
 {id:27,cod:'PRY-2026-0027',nom:'Renovación de la red de oficinas Techquk',cli:'Proyecto interno',niv:'Interno',dep:'Lambayeque',tip:'T1',est:'En ejecución',jefe:'Martín Chávez',ini:'2026-10-05',fin:'2026-12-18',av:52,C:0,Pp:28600,Co:21900,G:15300,Py:29400,pc99:0,val:0,cob:0,exc:0,gar:[],pal:['#E9D5FF','#6D28D9'],interno:true},
];

let rol='jefe', vista='portada', actual=null, tab='Resumen';
const F={salud:new Set(),est:new Set(),tip:new Set(),jefe:new Set(),niv:new Set(),dep:new Set()};
let q='', orden='reciente';
const fotos={}; // fotos subidas en esta sesión
const $=s=>document.querySelector(s);
const S=n=>'S/ '+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>(n*100).toFixed(1)+' %';
const fecha=d=>new Date(d).toLocaleDateString('es-PE',{day:'numeric',month:'short',year:'numeric'});
const ini=n=>n.split(' ').map(x=>x[0]).join('').slice(0,2);
const costos=()=>rol!=='sin';

// Cálculos de cada proyecto
P.forEach(p=>{
  const a=new Date(p.ini),b=new Date(p.fin);
  p.tiempo=Math.max(0,Math.min(100,Math.round((HOY-a)/(b-a)*100)));
  p.dias=Math.round((b-HOY)/864e5);
  p.atrasado=p.est==='En ejecución'&&p.av<p.tiempo-10;
  if(!p.interno){p.mPrev=(p.C-p.Pp)/p.C;p.mProy=(p.C-p.Py)/p.C;const d=p.mProy-p.mPrev;p.sem=p.mProy<0||d<-.06?'rojo':d<-.02?'ambar':'verde';}
  else p.sem=p.Py>p.Pp*1.02?'ambar':'verde';
  p.garVence=p.gar.some(g=>(new Date(g[2])-HOY)/864e5<=30);
  // Partidas: los presupuestos suman Pp; el gasto suma G
  const nombres=['Equipos y suministros','Cableado y canalización','Mano de obra de instalación','Subcontratos','Gastos generales'];
  const sp=[.44,.17,.21,.08,.10];
  const sg=p.exc>=3?[.38,.24,.25,.06,.07]:p.exc>=1?[.43,.21,.22,.06,.08]:[.45,.16,.21,.08,.10];
  let accP=0,accG=0;
  p.partidas=nombres.map((n,i)=>{
    const pr=i<4?Math.round(p.Pp*sp[i]*100)/100:Math.round((p.Pp-accP)*100)/100;accP+=pr;
    const g=i<4?Math.round(p.G*sg[i]*100)/100:Math.round((p.G-accG)*100)/100;accG+=g;
    return {cod:'PC-0'+(i+1),n,pr,g};
  });
  p.exc=p.partidas.filter(x=>x.g>x.pr).length;
  if(p.pc99) p.partidas.push({cod:'PC-99',n:'Gastos no presupuestados',pr:0,g:p.pc99});
});

const SEM={verde:['#16A34A','Margen en lo previsto'],ambar:['#D97706','Margen por debajo'],rojo:['#DC2626','Margen en riesgo']};

// Foto de referencia: si no se subió una, un dibujo según la tipología
function dibujo(p){
  const [c1,c2]=p.pal;
  const motivo={
    T2:`<g transform="translate(250,52)" fill="#fff" opacity=".9"><rect x="0" y="0" width="58" height="26" rx="6"/><rect x="58" y="7" width="14" height="12" rx="3"/><rect x="22" y="26" width="8" height="18"/></g>`,
    T1:`<g stroke="#fff" stroke-width="3" opacity=".85" fill="none"><path d="M240 60h90M240 75h90M240 90h90"/><circle cx="240" cy="60" r="4" fill="#fff"/><circle cx="330" cy="75" r="4" fill="#fff"/><circle cx="285" cy="90" r="4" fill="#fff"/></g>`,
    T3:`<g fill="#fff" opacity=".9"><rect x="262" y="44" width="40" height="60" rx="6"/><circle cx="282" cy="66" r="8" fill="${c2}"/><rect x="272" y="84" width="20" height="4" rx="2" fill="${c2}"/></g>`,
    T4:`<g fill="#fff" opacity=".9"><rect x="236" y="48" width="44" height="30" rx="4"/><rect x="286" y="48" width="44" height="30" rx="4"/><rect x="261" y="84" width="44" height="22" rx="4"/></g>`,
    T5:`<g fill="#fff" opacity=".9"><path d="M283 40c14 18 22 28 22 42a22 22 0 0 1-44 0c0-10 6-16 10-22 2 8 6 10 8 10-2-12 0-20 4-30z"/></g>`,
    T6:`<g stroke="#fff" stroke-width="3" fill="none" opacity=".9"><path d="M283 106V52M270 106l13-54 13 54"/><path d="M262 48a28 28 0 0 1 42 0M252 38a42 42 0 0 1 62 0"/></g>`,
  }[p.tip];
  return `<svg viewBox="0 0 400 225" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
   <defs><linearGradient id="g${p.id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs>
   <rect width="400" height="225" fill="url(#g${p.id})"/>
   <g fill="${c2}" opacity=".55"><rect x="20" y="120" width="70" height="105"/><rect x="95" y="95" width="90" height="130"/><rect x="190" y="135" width="60" height="90"/><rect x="330" y="110" width="70" height="115"/></g>
   <g fill="#fff" opacity=".35">${[...Array(12)].map((_,i)=>`<rect x="${105+(i%4)*20}" y="${108+Math.floor(i/4)*24}" width="10" height="12"/>`).join('')}</g>
   <rect y="205" width="400" height="20" fill="${c2}" opacity=".8"/>${motivo}</svg>`;
}
const foto=p=>fotos[p.id]?`<img src="${fotos[p.id]}" alt="">`:dibujo(p);

/* ---------- Portada ---------- */
function pasa(p,salvo){
  const t=(q||'').toLowerCase();
  if(t&&!(p.nom+p.cod+p.cli).toLowerCase().includes(t))return false;
  for(const k of ['est','tip','jefe','niv','dep']) if(k!==salvo&&F[k].size&&!F[k].has(p[k]))return false;
  if(salvo!=='salud'&&F.salud.size){
    for(const s of F.salud){
      if(s==='atrasado'&&!p.atrasado)return false;
      if(s==='margen'&&p.sem!=='rojo')return false;
      if(s==='excedidas'&&!p.exc)return false;
      if(s==='garantias'&&!p.garVence)return false;
    }
  }
  return true;
}
function grupo(titulo,k,ops){
  return `<h3>${titulo}</h3>`+ops.map(([v,lab,dot])=>{
    const n=P.filter(p=>pasa(p,k)&&(k==='salud'?saludDe(p,v):p[k]===v)).length;
    return `<label class="op ${n?'':'cero'}"><input type="checkbox" data-k="${k}" value="${v}" ${F[k].has(v)?'checked':''}>${dot?`<span class="dot" style="background:${dot}"></span>`:''}${lab}<span class="n">${n}</span></label>`;
  }).join('');
}
const saludDe=(p,v)=>({atrasado:p.atrasado,margen:p.sem==='rojo',excedidas:!!p.exc,garantias:p.garVence})[v];
const uniq=k=>[...new Set(P.map(p=>p[k]))].sort();

function portada(){
  if(!costos()){F.salud.delete('margen');F.salud.delete('excedidas');if(orden==='margen')orden='reciente';}
  let lista=P.filter(p=>pasa(p));
  const ord={reciente:(a,b)=>b.id-a.id,atraso:(a,b)=>(b.tiempo-b.av)-(a.tiempo-a.av),margen:(a,b)=>(a.mProy??1)-(b.mProy??1),vence:(a,b)=>a.dias-b.dias};
  lista.sort(ord[orden]);
  const salud=[['atrasado','Atrasados','#DC2626']];
  if(costos())salud.push(['margen','Margen en riesgo','#DC2626'],['excedidas','Con partidas excedidas','#D97706']);
  salud.push(['garantias','Garantías por vencer (30 días)','#D97706']);
  const chips=[];Object.entries(F).forEach(([k,s])=>s.forEach(v=>chips.push([k,v])));
  const etq=(k,v)=>k==='tip'?v+' · '+TIPOS[v]:k==='salud'?({atrasado:'Atrasados',margen:'Margen en riesgo',excedidas:'Partidas excedidas',garantias:'Garantías por vencer'})[v]:v;
  $('#ruta').innerHTML='Proyectos';
  $('#app').innerHTML=`
   <h1>Proyectos</h1><p class="sub">${P.length} proyectos · ${P.filter(p=>p.est==='En ejecución').length} en ejecución</p>
   <div class="portada">
    <aside class="filtros">
      ${grupo('Salud','salud',salud)}
      ${grupo('Estado','est',Object.keys(ESTADOS).map(e=>[e,e,ESTADOS[e][0]]))}
      ${grupo('Tipología','tip',Object.keys(TIPOS).map(t=>[t,t+' · '+TIPOS[t]]))}
      ${grupo('Jefe de proyecto','jefe',uniq('jefe').map(j=>[j,j,COLJ[j]]))}
      ${grupo('Nivel de gobierno','niv',uniq('niv').map(v=>[v,v]))}
      ${grupo('Departamento','dep',uniq('dep').map(v=>[v,v]))}
      <button class="limpiar" id="limpiar">Quitar todos los filtros</button>
    </aside>
    <section>
      <div class="barra">
        <div class="buscar">🔍<input id="q" placeholder="Buscar por nombre, código o cliente…" value="${q}"></div>
        <select class="orden" id="orden">
          <option value="reciente">Más recientes</option><option value="atraso">Más atrasados</option>
          ${costos()?'<option value="margen">Menor margen</option>':''}<option value="vence">Fin más cercano</option>
        </select>
      </div>
      ${chips.length?`<div class="chips">${chips.map(([k,v])=>`<span class="chip">${etq(k,v)}<button data-k="${k}" data-v="${v}">✕</button></span>`).join('')}</div>`:''}
      <div class="grid">${lista.map(tarjeta).join('')||'<div class="vacio">Ningún proyecto cumple los filtros.</div>'}</div>
    </section>
   </div>`;
  $('#orden').value=orden;
  $('#q').oninput=e=>{q=e.target.value;const pos=e.target.selectionStart;portada();const i=$('#q');i.focus();i.setSelectionRange(pos,pos);};
  $('#orden').onchange=e=>{orden=e.target.value;portada();};
  $('#limpiar').onclick=()=>{Object.values(F).forEach(s=>s.clear());q='';portada();};
  document.querySelectorAll('.filtros input').forEach(i=>i.onchange=()=>{const s=F[i.dataset.k];i.checked?s.add(i.value):s.delete(i.value);portada();});
  document.querySelectorAll('.chip button').forEach(b=>b.onclick=()=>{F[b.dataset.k].delete(b.dataset.v);portada();});
  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>abrir(+c.dataset.id));
}
function tarjeta(p){
  const [ce,cf]=ESTADOS[p.est];
  const colAv=p.atrasado?'var(--bad)':'var(--erp)';
  const sem=costos()&&p.est!=='Por iniciar'?`<span class="sem" title="${SEM[p.sem][1]}"><span class="dot" style="background:${SEM[p.sem][0]}"></span>${p.interno?'Costo':'Margen'}</span>`:'';
  const dias=p.est==='Cerrado'?'Cerrado el '+fecha(p.fin):p.est==='Por iniciar'?'Empieza el '+fecha(p.ini):p.dias<0?`<b style="color:var(--bad)">${-p.dias} días vencido</b>`:`Faltan ${p.dias} días`;
  return `<article class="card" data-id="${p.id}">
   <div class="foto">${foto(p)}<span class="estado" style="color:${ce}">● ${p.est}</span>${sem}</div>
   <div class="cuerpo">
     <div class="cod">${p.cod} · ${p.tip}</div>
     <div class="nom">${p.nom}</div>
     <div class="cli">${p.cli}</div>
     <div class="barras">
       <div class="b">Avance<div class="track"><div class="fill" style="width:${p.av}%;background:${colAv}"></div></div><span>${p.av} %</span></div>
       <div class="b">Plazo<div class="track"><div class="fill" style="width:${p.tiempo}%;background:#A1A1AA"></div></div><span>${p.tiempo} %</span></div>
     </div>
     <div class="pie"><span class="av" style="background:${COLJ[p.jefe]}">${ini(p.jefe)}</span>${p.jefe}<span class="dias">${dias}</span></div>
   </div></article>`;
}

/* ---------- Ficha ---------- */
const TABS=[['Resumen'],['Presupuesto','ya existe'],['Partidas de control','ya existe'],['Compras y almacén'],['Personal'],['Contrato'],['Valorizaciones'],['Subcontratos'],['Archivos y fotos'],['Historial','ya existe']];
const LLEGA={'Compras y almacén':'requerimientos, órdenes y almacenes (etapa 2)','Personal':'colaboradores, habilitación y tareo (etapa 2)','Contrato':'contratos, hitos, garantías y adendas (etapa 2)','Valorizaciones':'valorizaciones y subcontratos (etapa 2)','Subcontratos':'valorizaciones y subcontratos (etapa 2)','Archivos y fotos':'la galería de avance sobre los adjuntos del núcleo','Presupuesto':'— ya existe (2.9 y 2.10)','Partidas de control':'— ya existe (2.1, 2.9b y 2.11)','Historial':'— ya existe'};

function abrir(id){actual=P.find(p=>p.id===id);vista='ficha';tab='Resumen';ficha();window.scrollTo(0,0);}
function ficha(){
  const p=actual,[ce]=ESTADOS[p.est];
  $('#ruta').innerHTML=`<a id="volver">Proyectos</a> › ${p.cod}`;
  const puedeFoto=rol==='jefe';
  $('#app').innerHTML=`
   <div class="hero">
     <div class="fondo">${foto(p)}</div>
     <div class="acc">${puedeFoto?`<button class="btn" id="cambiar" title="Solo el jefe de proyecto cambia la foto">📷 Cambiar foto</button>`:''}<button class="btn sol">Acciones ▾</button></div>
     <div class="in">
       <div style="font-size:12px;opacity:.85">${p.cod} · ${p.tip} ${TIPOS[p.tip]} · <span style="background:#fff;color:${ce};border-radius:99px;padding:1px 8px;font-weight:600">${p.est}</span></div>
       <h1>${p.nom}</h1>
       <div style="opacity:.9">${p.cli}${p.niv!=='Interno'?' · Gobierno '+p.niv.toLowerCase():''} · ${p.dep}</div>
       <div class="meta">
         <div><b>Jefe de proyecto</b>${p.jefe}</div>
         <div><b>Plazo</b>${fecha(p.ini)} → ${fecha(p.fin)}</div>
         <div><b>Avance físico</b>${p.av} % <span style="opacity:.7">(plazo ${p.tiempo} %)</span></div>
         ${costos()&&!p.interno?`<div><b>Monto contratado</b>${S(p.C)}</div>`:''}
       </div>
     </div>
   </div>
   <nav class="tabs">${TABS.map(([t,x])=>`<button class="tab ${t===tab?'on':''}" data-t="${t}">${t}${x?`<small>${x}</small>`:''}</button>`).join('')}</nav>
   <div id="cont">${tab==='Resumen'?resumen(p):`<div class="prox"><b>${tab}</b><br>Esta pestaña la aporta su módulo ${LLEGA[tab]||''}. El prototipo solo dibuja el Resumen.</div>`}</div>`;
  $('#volver').onclick=()=>{vista='portada';portada();};
  if(puedeFoto)$('#cambiar').onclick=()=>$('#subir').click();
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=b.dataset.t;ficha();});
  document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>detalle(e.dataset.d));
}

function resumen(p){
  return `<div class="res"><div class="col">${costos()?dinero(p):`<div class="oculto">🔒 <b>¿Cuánto estamos ganando?</b> — esta sección solo la ve quien tiene permiso de ver costos.</div>`}${plazo(p)}${p.interno?'':cobros(p)}</div>
   <div class="col">${alertas(p)}${actividad(p)}</div></div>`;
}

function dinero(p){
  const base=Math.max(p.C,p.Py,p.Pp);
  const filas=p.interno
   ?[['Presupuestado',p.Pp,'#6366F1','pres'],['Comprometido',p.Co,'#0891B2','comp'],['Gastado real',p.G,'#01006F','gast'],['Proyección al cierre',p.Py,SEM[p.sem][0],'proy']]
   :[['Contratado',p.C,'#A1A1AA','cont'],['Presupuestado',p.Pp,'#6366F1','pres'],['Comprometido',p.Co,'#0891B2','comp'],['Gastado real',p.G,'#01006F','gast'],['Proyección al cierre',p.Py,SEM[p.sem][0],'proy']];
  const k=p.interno
   ?[['Costo presupuestado',S(p.Pp),''],['Proyección al cierre',S(p.Py),`<span style="color:${SEM[p.sem][0]}">${p.Py>p.Pp?'+':''}${S(p.Py-p.Pp)} contra lo presupuestado</span>`],['Gastos no presupuestados',S(p.pc99),'PC-99']]
   :[['Margen previsto',pct(p.mPrev),S(p.C-p.Pp)],['Margen proyectado',`<span style="color:${SEM[p.sem][0]}">${pct(p.mProy)}</span>`,`${((p.mProy-p.mPrev)*100).toFixed(1)} pts · ${S(p.C-p.Py)}`],['Gastos no presupuestados',`<span class="link" data-d="pc99">${S(p.pc99)}</span>`,'Cargados a la PC-99']];
  const top=[...p.partidas].filter(x=>x.cod!=='PC-99').map(x=>({...x,uso:x.g/x.pr})).sort((a,b)=>b.uso-a.uso).slice(0,5);
  return `<div class="sec"><h2>¿Cuánto estamos ganando? <span class="q">Dinero</span></h2>
   <p class="exp">Toca cualquier monto para ver de qué está hecho, hasta el documento que lo respalda.</p>
   <div class="kpis">${k.map(([l,v,d])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d" style="color:var(--muted)">${d}</div></div>`).join('')}</div>
   <div class="cas">${filas.map(([l,v,c,d])=>`<div class="row" data-d="${d}"><span>${l}</span><div class="t"><div class="f" style="width:${v/base*100}%;background:${c}"></div></div><span class="m">${S(v)}</span></div>`).join('')}</div>
   <div class="dos">
     <div class="mini"><h4>Costo en el tiempo (curva S)</h4>${curvaS(p)}</div>
     <div class="mini"><h4>Partidas que más consumen su saldo</h4>
      <table><tr><th>Partida</th><th class="n">Usado</th></tr>${top.map(x=>{const c=x.uso>1?'var(--bad)':x.uso>.85?'var(--warn)':'var(--ok)';return `<tr class="cl" data-d="partida:${x.cod}"><td>${x.cod} ${x.n}</td><td class="n" style="color:${c};font-weight:600">${Math.round(x.uso*100)} %</td></tr>`}).join('')}</table></div>
   </div></div>`;
}

function curvaS(p){
  const W=320,H=150,pad=24,a=new Date(p.ini),b=new Date(p.fin),dur=b-a;
  const x=t=>pad+(t-a)/dur*(W-2*pad), max=Math.max(p.Pp,p.Py)*1.08, y=v=>H-pad-v/max*(H-2*pad);
  const sig=f=>1/(1+Math.exp(-10*(f-.5)));const s0=sig(0),s1=sig(1);
  let plan='';for(let i=0;i<=30;i++){const f=i/30;plan+=`${i?'L':'M'}${x(+a+dur*f).toFixed(1)} ${y(p.Pp*(sig(f)-s0)/(s1-s0)).toFixed(1)} `;}
  const fh=Math.min(1,Math.max(0,(HOY-a)/dur));let real='';
  if(fh>0){for(let i=0;i<=20;i++){const f=fh*i/20;const v=p.G*Math.pow(i/20,1.6);real+=`${i?'L':'M'}${x(+a+dur*f).toFixed(1)} ${y(v).toFixed(1)} `;}}
  const proy=fh>0&&fh<1?`<path d="M${x(+a+dur*fh)} ${y(p.G)} L${x(+b)} ${y(p.Py)}" stroke="${SEM[p.sem][0]}" stroke-width="2" stroke-dasharray="4 4" fill="none"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%">
   <line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#E4E4E7"/>
   <path d="${plan}" stroke="#A5B4FC" stroke-width="2" fill="none"/>
   ${real?`<path d="${real}" stroke="#01006F" stroke-width="2.5" fill="none"/>`:''}${proy}
   ${fh>0&&fh<1?`<line x1="${x(+HOY)}" y1="${pad-6}" x2="${x(+HOY)}" y2="${H-pad}" stroke="#DC2626" stroke-dasharray="2 3"/><text x="${x(+HOY)}" y="${pad-9}" font-size="9" fill="#DC2626" text-anchor="middle">hoy</text>`:''}
   <text x="${pad}" y="${H-8}" font-size="9" fill="#71717A">${fecha(p.ini)}</text><text x="${W-pad}" y="${H-8}" font-size="9" fill="#71717A" text-anchor="end">${fecha(p.fin)}</text>
  </svg><div class="ley"><span><span class="dot" style="background:#A5B4FC"></span>Planeado</span><span><span class="dot" style="background:#01006F"></span>Real</span><span><span class="dot" style="background:${SEM[p.sem][0]}"></span>Proyección</span></div>`;
}

function plazo(p){
  const fases=[['Planificación',0,.12],['Ingeniería',.08,.25],['Suministro',.2,.5],['Instalación',.35,.85],['Pruebas',.8,.95],['Entrega',.93,1]];
  const h=p.av, th=Math.min(100,Math.max(0,p.tiempo)); // las fases se completan con el avance; la línea roja es hoy
  const a=new Date(p.ini),dur=new Date(p.fin)-a,fd=f=>fecha(new Date(+a+dur*f));
  const hitos=[['Entrega de ingeniería',.25],['Primera valorización',.4],['Instalación concluida',.85],['Acta de conformidad',1]];
  const penal=p.atrasado&&!p.interno?`<div class="alerta" style="background:var(--bad-soft);margin-top:12px;cursor:default"><span class="i" style="background:var(--bad)">!</span><div><b>Si no recupera el ritmo, termina con unos ${Math.round((p.tiempo-p.av)/100*(dur/864e5))} días de atraso.</b>${costos()?`<small>Penalidad estimada al ritmo actual: ${S(Math.round(p.C*0.10*Math.min(1,(p.tiempo-p.av)/100*(dur/864e5)/60)*100)/100)} (tope 10 % del contrato).</small>`:'<small>La penalidad estimada la ve quien tiene permiso de costos.</small>'}</div></div>`:'';
  return `<div class="sec"><h2>¿Vamos a tiempo? <span class="q">Plazo</span></h2>
   <p class="exp">Fases de la tipología ${p.tip} e hitos del contrato, pintados según el avance físico. La línea roja es hoy: si queda a la derecha de lo pintado, el proyecto va atrasado.</p>
   <div class="kpis"><div class="kpi"><div class="l">Avance físico</div><div class="v" style="color:${p.atrasado?'var(--bad)':'inherit'}">${p.av} %</div><div class="d" style="color:var(--muted)">Esperado hoy: ${p.tiempo} %</div></div>
   <div class="kpi"><div class="l">${p.dias>=0?'Días que faltan':'Días vencido'}</div><div class="v">${Math.abs(p.dias)}</div><div class="d" style="color:var(--muted)">Fin previsto ${fecha(p.fin)}</div></div>
   <div class="kpi"><div class="l">Fase actual</div><div class="v" style="font-size:16px;padding-top:4px">${p.est==='Por iniciar'?'—':p.est==='Cerrado'?'Cerrado':(fases.filter(f=>h/100>=f[1]).pop()||fases[0])[0]}</div><div class="d" style="color:var(--muted)">${p.est}</div></div></div>
   <div class="gantt">${fases.map(([n,s,e])=>{const done=h/100>=e,col=done?'#0891B2':h/100>s?'#67E8F9':'#E4E4E7';return `<div class="gl"><span>${n}</span><div class="gt"><div class="gb" style="left:${s*100}%;width:${(e-s)*100}%;background:${col}"></div></div></div>`}).join('')}
   ${th>0&&th<100?`<div title="Hoy" style="position:absolute;top:0;bottom:0;left:calc(130px + (100% - 130px)*${th/100});width:2px;background:rgba(220,38,38,.6)"></div>`:''}</div>
   <div class="hitos">${hitos.map(([n,f])=>{const ok=h/100>=f;return `<div class="hito"><span class="rombo" style="background:${ok?'var(--ok)':'#D4D4D8'}"></span>${n}<span style="margin-left:auto;color:var(--muted)">${fd(f)}${ok?' · cumplido':''}</span></div>`}).join('')}</div>${penal}</div>`;
}

function cobros(p){
  const porVal=p.C-p.val,valNo=p.val-p.cob;
  const lado=costos()?`<div class="cobro"><div style="width:${p.cob/p.C*100}%;background:#16A34A"></div><div style="width:${valNo/p.C*100}%;background:#FBBF24"></div><div style="width:${porVal/p.C*100}%;background:#E4E4E7"></div></div>
     <div class="ley"><span><span class="dot" style="background:#16A34A"></span>Cobrado <b class="link" data-d="cob">${S(p.cob)}</b></span><span><span class="dot" style="background:#FBBF24"></span>Valorizado por cobrar <b>${S(valNo)}</b></span><span><span class="dot" style="background:#E4E4E7"></span>Por valorizar <b>${S(porVal)}</b></span></div>`
   :`<div class="cobro"><div style="width:${p.cob/p.C*100}%;background:#16A34A"></div><div style="width:${valNo/p.C*100}%;background:#FBBF24"></div><div style="width:${porVal/p.C*100}%;background:#E4E4E7"></div></div><div class="ley"><span>Cobrado ${Math.round(p.cob/p.C*100)} % · valorizado ${Math.round(p.val/p.C*100)} % del contrato</span></div>`;
  return `<div class="sec"><h2>¿Cuánto nos han pagado? <span class="q">Cobranza</span></h2><p class="exp">Valorizaciones del contrato y garantías entregadas al cliente.</p>${lado}
   <h4 style="font-size:12px;color:var(--muted);margin:16px 0 4px;font-weight:600">Cartas fianza</h4>
   ${p.gar.length?`<table><tr><th>Garantía</th>${costos()?'<th class="n">Monto</th>':''}<th class="n">Vence</th></tr>${p.gar.map(g=>{const d=Math.round((new Date(g[2])-HOY)/864e5);return `<tr><td>${g[0]}</td>${costos()?`<td class="n">${S(g[1])}</td>`:''}<td class="n">${fecha(g[2])} ${d<=30?`<span class="pill" style="background:var(--warn-soft);color:var(--warn)">en ${d} días</span>`:''}</td></tr>`}).join('')}</table>`:'<p style="color:var(--muted);font-size:12.5px;margin:0">Este proyecto no tiene garantías.</p>'}</div>`;
}

function alertas(p){
  const a=[];
  if(p.atrasado)a.push(['bad','Avance por debajo del plazo',`${p.av} % de avance con ${p.tiempo} % del plazo transcurrido`]);
  if(costos()&&p.exc)a.push(['warn',`${p.exc} partida${p.exc>1?'s':''} excedida${p.exc>1?'s':''}`,'Abre el árbol de partidas']);
  p.gar.forEach(g=>{const d=Math.round((new Date(g[2])-HOY)/864e5);if(d<=30)a.push(['warn',`Carta fianza por vencer en ${d} días`,g[0]+' · renovarla con el banco']);});
  if(p.pc99&&costos())a.push(['warn','Posible adicional sin tramitar','Un gasto en la PC-99 se marcó como posible adicional']);
  if(p.est==='En ejecución')a.push(['info','2 aprobaciones esperando','Requerimiento REQ-2026-0'+(140+p.id)+' y orden OC-2026-0'+(310+p.id)]);
  if(p.est==='Por iniciar')a.push(['info','Falta armar el árbol de partidas','Sin árbol no se puede imputar ningún costo']);
  const col={bad:['var(--bad)','var(--bad-soft)'],warn:['var(--warn)','var(--warn-soft)'],info:['var(--erp)','var(--erp-soft)']};
  return `<div class="sec"><h2>¿Qué necesita atención hoy?</h2><p class="exp">Cada aviso lleva a donde se resuelve.</p>
   ${a.length?a.map(([t,ti,s])=>`<div class="alerta" style="background:${col[t][1]}"><span class="i" style="background:${col[t][0]}">${t==='info'?'i':'!'}</span><div><b>${ti}</b><small>${s}</small></div></div>`).join(''):'<p style="color:var(--muted);margin:0">Nada pendiente. 👍</p>'}</div>`;
}
function actividad(p){
  const it=[[p.jefe,'registró el avance semanal: '+p.av+' %','hace 2 horas'],['Lucía Torres','emitió la orden OC-2026-0'+(310+p.id),'ayer'],['Carlos Mendoza','recepcionó 12 cámaras en el almacén de obra','hace 2 días'],[p.jefe,'subió 6 fotos de avance','hace 3 días'],['Gerencia','aprobó el requerimiento REQ-2026-0'+(130+p.id),'hace 4 días']];
  return `<div class="sec"><h2>Actividad reciente</h2><p class="exp">Quién hizo qué en el proyecto.</p>${it.map(([q,t,c])=>`<div class="act"><span class="av" style="background:${COLJ[q]||'#94A3B8'}">${ini(q)}</span><div><b>${q}</b> ${t}<small>${c}</small></div></div>`).join('')}<div style="text-align:right;margin-top:8px"><span class="link" style="font-size:12px">Ver todo el historial →</span></div></div>`;
}

/* ---------- Panel deslizante: del total al documento ---------- */
function docsDe(x,i){
  if(!x.g)return [];
  const n=x.cod==='PC-99'?1:3,parts=[.5,.3,.2],tipos=x.n.includes('Mano')?['Tareo semana 41','Tareo semana 42','Tareo semana 43']:x.n.includes('Sub')?['Valorización SUB-2026-00'+(11+i)]:x.cod==='PC-99'?['Gasto en OC-2026-0'+(402+i)+' · traslado no previsto']:['OC-2026-0'+(320+i*3),'OC-2026-0'+(321+i*3),'Comprobante F001-00'+(4580+i)];
  return tipos.slice(0,n).map((t,j)=>[t,n===1?x.g:Math.round(x.g*parts[j]*100)/100]);
}
function tablaPartidas(p,campo,titulo,sub,soloCod){
  const filas=p.partidas.filter(x=>!soloCod||x.cod===soloCod);
  $('#pt').textContent=titulo;$('#ps').textContent=sub;
  $('#pb').innerHTML=`<div class="miga">${p.cod} › ${titulo}</div><table><tr><th>Partida</th><th class="n">Presupuestado</th><th class="n">${campo}</th><th class="n">Saldo</th></tr>
   ${filas.map((x,i)=>{const v=campo==='Gastado'?x.g:Math.round(x.g*(p.Co/Math.max(p.G,1))*100)/100;const sal=x.pr-v;return `<tr class="cl" data-i="${i}"><td>▸ ${x.cod} ${x.n}</td><td class="n">${S(x.pr)}</td><td class="n">${S(v)}</td><td class="n" style="color:${sal<0?'var(--bad)':'inherit'}">${S(sal)}</td></tr>`+docsDe(x,i).map(([d,m])=>`<tr class="docs" data-de="${i}" hidden><td style="padding-left:22px">📄 <span class="link">${d}</span></td><td></td><td class="n">${S(m)}</td><td></td></tr>`).join('')}).join('')}
   </table><p class="nota">Toca una partida para ver sus documentos; toca un documento para abrir la orden, el tareo o el comprobante.</p>`;
  document.querySelectorAll('#pb tr.cl').forEach(r=>r.onclick=()=>{document.querySelectorAll(`#pb tr[data-de="${r.dataset.i}"]`).forEach(d=>d.hidden=!d.hidden);});
  if(soloCod)document.querySelectorAll('#pb tr.docs').forEach(d=>d.hidden=false);
}
function detalle(d){
  const p=actual;
  if(d==='gast')tablaPartidas(p,'Gastado','Gastado real · '+S(p.G),'Por partida de control, con sus documentos');
  else if(d==='comp')tablaPartidas(p,'Comprometido','Comprometido · '+S(p.Co),'Órdenes emitidas y aún no pagadas, por partida');
  else if(d==='pres'){$('#pt').textContent='Presupuestado · '+S(p.Pp);$('#ps').textContent='El costo presupuestado del árbol de partidas';$('#pb').innerHTML=`<table><tr><th>Partida</th><th class="n">Monto</th></tr>${p.partidas.filter(x=>x.cod!=='PC-99').map(x=>`<tr><td>${x.cod} ${x.n}</td><td class="n">${S(x.pr)}</td></tr>`).join('')}</table><p class="nota">Abre la pestaña «Partidas de control» para el árbol completo.</p>`;}
  else if(d==='pc99')tablaPartidas(p,'Gastado','Gastos no presupuestados · '+S(p.pc99),'Lo cargado a la PC-99, con su motivo','PC-99');
  else if(d.startsWith('partida:'))tablaPartidas(p,'Gastado','Partida '+d.slice(8),'Sus documentos',d.slice(8));
  else if(d==='proy'){$('#pt').textContent='Proyección al cierre · '+S(p.Py);$('#ps').textContent='Cómo se calcula';$('#pb').innerHTML=`<table><tr><td>Gastado real</td><td class="n">${S(p.G)}</td></tr><tr><td>+ Comprometido por pagar</td><td class="n">${S(p.Co-p.G)}</td></tr><tr><td>+ Saldo por comprometer, al ritmo actual</td><td class="n">${S(p.Py-p.Co)}</td></tr><tr><td><b>Proyección al cierre</b></td><td class="n"><b>${S(p.Py)}</b></td></tr></table><p class="nota">Supuesto del prototipo: el saldo de cada partida se proyecta con su consumo hasta hoy. La regla real se decide en el plan.</p>`;}
  else if(d==='cont'){$('#pt').textContent='Contratado · '+S(p.C);$('#ps').textContent='Contrato y adendas';$('#pb').innerHTML=`<table><tr><td>Contrato original</td><td class="n">${S(p.C)}</td></tr><tr><td>Adendas</td><td class="n">${S(0)}</td></tr></table><p class="nota">Llega con el módulo de contratos.</p>`;}
  else if(d==='cob'){$('#pt').textContent='Cobrado · '+S(p.cob);$('#ps').textContent='Pagos del cliente por valorización';$('#pb').innerHTML=`<table><tr><th>Valorización</th><th class="n">Cobrado</th></tr><tr><td>VAL-01</td><td class="n">${S(Math.round(p.cob*.55*100)/100)}</td></tr><tr><td>VAL-02</td><td class="n">${S(Math.round(p.cob*.45*100)/100)}</td></tr></table>`;}
  else return;
  $('#panel').classList.add('on');$('#velo').classList.add('on');
}
const cerrar=()=>{$('#panel').classList.remove('on');$('#velo').classList.remove('on');};
$('#px').onclick=cerrar;$('#velo').onclick=cerrar;document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});

/* Subir la foto: se recorta a 16:9 y se achica en el navegador antes de guardarla */
$('#subir').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const img=new Image();
  img.onload=()=>{const W=1280,H=720,c=document.createElement('canvas');c.width=W;c.height=H;const r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);fotos[actual.id]=c.toDataURL('image/jpeg',.82);URL.revokeObjectURL(img.src);ficha();};
  img.src=URL.createObjectURL(f);e.target.value='';
};
$('#rol').onchange=e=>{rol=e.target.value;vista==='portada'?portada():ficha();};
portada();
</script>
