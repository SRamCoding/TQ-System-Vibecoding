function tourStart(id){S.tour=D.flujos.find(f=>f.id===id);S.step=0;tourShow()}
function tourShow(){const f=S.tour;if(!f)return;const s=f.s[S.step];go(s[0]);$("#tour").classList.add("on");$("#tourT").textContent=`${f.t} · paso ${S.step+1} de ${f.s.length}: ${s[1]}`;$("#tourX").textContent=s[2];$("#tourS").textContent="Puedes seguir navegando libremente y volver aquí con Siguiente."}
function tourNext(){if(!S.tour)return;if(S.step<S.tour.s.length-1){S.step++;tourShow()}else tourEnd()}
