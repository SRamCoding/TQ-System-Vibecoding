<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera de oportunidad</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible{outline:2px solid #0F6E56;outline-offset:2px}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:#1E2B28;background:#FFFFFF">
<div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 18px;background:#F8F7F2">
<h1 style="margin:0;font-size:18px;font-weight:600">Videovigilancia · Muni. de Pimentel</h1>
<span style="font-size:15px;font-weight:600">S/ 240 000</span>
<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#E4EEF9;color:#1D5FA5">Calificada · 25 %</span>
<span style="flex:1"></span>
<a href="OpCotizaciones.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #9AA39F;background:#FFFFFF;color:#1E2B28;text-decoration:none">Nueva cotización</a>
<a href="OpAvanzar.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #0F6E56;background:#0F6E56;color:#FFFFFF;text-decoration:none">Avanzar etapa</a>
</div>
<ol aria-label="Etapas del embudo" style="margin:0;padding:12px 18px;list-style:none;display:flex;flex-wrap:wrap;gap:8px;background:#FFFFFF">
<li style="flex:1 1 130px;border-radius:8px;padding:8px 10px;background:#DDF3E6;color:#0B5A32;font-size:13px;font-weight:600">Prospecto<br><span style="font-weight:400;font-size:12px">hecho</span></li>
<li aria-current="step" style="flex:1 1 130px;border-radius:8px;padding:8px 10px;background:#0F6E56;color:#FFFFFF;font-size:13px;font-weight:600">Calificada<br><span style="font-weight:400;font-size:12px">etapa actual</span></li>
<li style="flex:1 1 130px;border-radius:8px;padding:8px 10px;background:#EEEDE6;color:#4A5551;font-size:13px;font-weight:600">Propuesta enviada<br><span style="font-weight:400;font-size:12px">pendiente</span></li>
<li style="flex:1 1 130px;border-radius:8px;padding:8px 10px;background:#EEEDE6;color:#4A5551;font-size:13px;font-weight:600">Negociación<br><span style="font-weight:400;font-size:12px">pendiente</span></li>
<li style="flex:1 1 130px;border-radius:8px;padding:8px 10px;background:#EEEDE6;color:#4A5551;font-size:13px;font-weight:600">Cierre<br><span style="font-weight:400;font-size:12px">pendiente</span></li>
</ol>
<nav aria-label="Secciones de la oportunidad" style="display:flex;overflow-x:auto;border-top:1px solid #E8E6DE;border-bottom:1px solid #E8E6DE;padding:0 10px;background:#FFFFFF">
<sc-for list="{{items}}" as="it" hint-placeholder-count="9">
<a href="{{it.href}}" aria-current="{{it.cur}}" style="padding:0 14px;min-height:44px;display:flex;align-items:center;font-size:13.5px;white-space:nowrap;text-decoration:none;color:{{it.fg}};font-weight:{{it.fw}};border-bottom:2px solid {{it.bd}}">{{it.t}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"text","default":"resumen"},"$preview":{"width":1280,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'resumen';
    const base = [
      { k: 'resumen', t: 'Resumen', href: 'Oportunidad.dc.html' },
      { k: 'cotizaciones', t: 'Cotizaciones', href: 'OpCotizaciones.dc.html' },
      { k: 'presupuesto', t: 'Presupuesto', href: 'OpPresupuesto.dc.html' },
      { k: 'actividades', t: 'Actividades', href: 'OpActividades.dc.html' },
      { k: 'competidores', t: 'Competidores', href: 'OpCompetidores.dc.html' },
      { k: 'documentos', t: 'Documentos', href: 'OpDocumentos.dc.html' },
      { k: 'historial', t: 'Historial de etapas', href: 'OpHistorial.dc.html' },
      { k: 'avanzar', t: 'Avanzar etapa', href: 'OpAvanzar.dc.html' },
      { k: 'cerrar', t: 'Cerrar', href: 'OpCerrar.dc.html' }
    ];
    return {
      items: base.map((it) => ({
        ...it,
        cur: it.k === tab ? 'page' : 'false',
        fg: it.k === tab ? '#0F6E56' : '#5E6A66',
        fw: it.k === tab ? '600' : '400',
        bd: it.k === tab ? '#0F6E56' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
