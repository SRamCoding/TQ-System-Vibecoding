<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera de cuenta</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible{outline:2px solid #0F6E56;outline-offset:2px}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:#1E2B28;background:#FFFFFF">
<div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 18px;background:#F8F7F2">
<h1 style="margin:0;font-size:18px;font-weight:600">Municipalidad de Pimentel</h1>
<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#DDF3E6;color:#0B5A32">Cliente activo</span>
<span style="font-size:13px;color:#5E6A66">RUC <span style="font-family:'IBM Plex Mono',monospace">20176543210</span></span>
<span style="flex:1"></span>
<a href="CuentaOportunidadNueva.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #9AA39F;background:#FFFFFF;color:#1E2B28;text-decoration:none">Nueva oportunidad</a>
<a href="CuentaActividades.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #0F6E56;background:#0F6E56;color:#FFFFFF;text-decoration:none">Registrar actividad</a>
</div>
<nav aria-label="Secciones de la cuenta" style="display:flex;overflow-x:auto;border-top:1px solid #E8E6DE;border-bottom:1px solid #E8E6DE;padding:0 10px;background:#FFFFFF">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<a href="{{it.href}}" aria-current="{{it.cur}}" style="padding:0 14px;min-height:44px;display:flex;align-items:center;font-size:13.5px;white-space:nowrap;text-decoration:none;color:{{it.fg}};font-weight:{{it.fw}};border-bottom:2px solid {{it.bd}}">{{it.t}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"text","default":"resumen"},"$preview":{"width":1280,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'resumen';
    const base = [
      { k: 'resumen', t: 'Resumen', href: 'Cuenta.dc.html' },
      { k: 'contactos', t: 'Contactos', href: 'Contactos.dc.html' },
      { k: 'oportunidades', t: 'Oportunidades', href: 'CuentaOportunidades.dc.html' },
      { k: 'cotizaciones', t: 'Cotizaciones', href: 'CuentaCotizaciones.dc.html' },
      { k: 'licitaciones', t: 'Licitaciones', href: 'CuentaLicitaciones.dc.html' },
      { k: 'actividades', t: 'Actividades', href: 'CuentaActividades.dc.html' },
      { k: 'contratos', t: 'Contratos y facturación', href: 'CuentaContratos.dc.html' },
      { k: 'historial', t: 'Historial', href: 'CuentaHistorial.dc.html' }
    ];
    return {
      items: base.map((it) => ({
        ...it,
        cur: it.k === tab ? 'page' : 'false',
        fg: it.k === tab ? '#0F6E56' : '#5E6A66',
        fw: it.k === tab ? '600' : '400',
        bd: it.k === tab ? '#0F6E56' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
