<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cabecera de licitación</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible{outline:2px solid #0F6E56;outline-offset:2px}
</style>
</helmet>
<div style="font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px;line-height:1.45;color:#1E2B28;background:#FFFFFF">
<div style="display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding:14px 18px;background:#F8F7F2">
<h1 style="margin:0;font-size:17px;font-weight:600">LP-2026-014 · Muni. de Pimentel</h1>
<span style="display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:600;background:#E4EEF9;color:#1D5FA5">En preparación</span>
<span style="flex:1"></span>
<a href="LicConsultas.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:500;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #9AA39F;background:#FFFFFF;color:#1E2B28;text-decoration:none">Registrar consulta</a>
<a href="LicPropuesta.dc.html" style="display:inline-flex;align-items:center;font-size:13.5px;font-weight:600;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid #0F6E56;background:#0F6E56;color:#FFFFFF;text-decoration:none">Registrar propuesta</a>
</div>
<nav aria-label="Secciones de la licitación" style="display:flex;overflow-x:auto;border-top:1px solid #E8E6DE;border-bottom:1px solid #E8E6DE;padding:0 10px;background:#FFFFFF">
<sc-for list="{{items}}" as="it" hint-placeholder-count="10">
<a href="{{it.href}}" aria-current="{{it.cur}}" style="padding:0 14px;min-height:44px;display:flex;align-items:center;font-size:13.5px;white-space:nowrap;text-decoration:none;color:{{it.fg}};font-weight:{{it.fw}};border-bottom:2px solid {{it.bd}}">{{it.t}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tab":{"editor":"text","default":"datos"},"$preview":{"width":1280,"height":150}}'>
class Component extends DCLogic {
  renderVals() {
    const tab = this.props.tab ?? 'datos';
    const base = [
      { k: 'datos', t: 'Datos generales', href: 'LicDatos.dc.html' },
      { k: 'cronograma', t: 'Cronograma', href: 'LicCronograma.dc.html' },
      { k: 'expediente', t: 'Expediente', href: 'LicExpediente.dc.html' },
      { k: 'requisitos', t: 'Requisitos', href: 'LicRequisitos.dc.html' },
      { k: 'preparacion', t: 'Preparación', href: 'LicPreparacion.dc.html' },
      { k: 'analisis', t: 'Análisis', href: 'LicAnalisis.dc.html' },
      { k: 'consultas', t: 'Consultas', href: 'LicConsultas.dc.html' },
      { k: 'propuesta', t: 'Propuesta', href: 'LicPropuesta.dc.html' },
      { k: 'resultado', t: 'Resultado', href: 'LicResultado.dc.html' },
      { k: 'historico', t: 'Histórico de la entidad', href: 'LicHistorico.dc.html' }
    ];
    return {
      items: base.map((it) => ({
        ...it,
        cur: it.k === tab ? 'page' : 'false',
        fg: it.k === tab ? '#0F6E56' : '#5E6A66',
        fw: it.k === tab ? '600' : '400',
        bd: it.k === tab ? '#0F6E56' : 'transparent'
      }))
    };
  }
}
</script>
</body>
</html>
