<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Barra superior</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:focus-visible,input:focus-visible{outline:2px solid #0F6E56;outline-offset:2px}
</style>
</helmet>
<header style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;min-height:56px;padding:6px 20px;box-sizing:border-box;background:#FFFFFF;border-bottom:1px solid #DAD8CF;color:#1E2B28;font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:14px">
<div style="display:flex;align-items:center;gap:10px"><div aria-hidden="true" style="width:28px;height:28px;border-radius:7px;background:#0F6E56;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px">T</div><span style="font-weight:600;font-size:16px">Techquk</span><span style="font-size:12px;font-weight:600;color:#0B5A47;background:#E1F5EE;border-radius:10px;padding:2px 10px">CRM</span></div>
<label style="flex:1 1 280px;max-width:520px;display:flex;align-items:center;gap:8px;border:1px solid #DAD8CF;border-radius:8px;padding:0 10px;min-height:40px;background:#F8F7F2;color:#5E6A66"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><span style="position:absolute;left:-9999px">Buscar</span><input type="search" placeholder="Buscar cuenta, oportunidad, cotización…" style="flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;color:#1E2B28;min-width:0"><span style="font-family:'IBM Plex Mono',monospace;font-size:11px;border:1px solid #DAD8CF;border-radius:4px;padding:1px 6px;background:#FFFFFF">Ctrl K</span></label>
<div style="margin-left:auto;display:flex;align-items:center;gap:10px">
<a href="#" aria-label="Alertas, {{alertas}} sin leer" style="position:relative;display:flex;align-items:center;justify-content:center;width:44px;height:44px;color:#5E6A66"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"></path></svg><span style="position:absolute;top:6px;right:5px;background:#B3261E;color:#FFFFFF;font-size:10px;font-weight:600;border-radius:9px;padding:0 5px;line-height:16px">{{alertas}}</span></a>
<span title="{{rol}}" style="width:32px;height:32px;border-radius:50%;background:#E1F5EE;color:#0B5A47;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px">{{iniciales}}</span>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"iniciales":{"editor":"text","default":"AR"},"rol":{"editor":"text","default":"A. Ruiz · Ejecutivo comercial"},"alertas":{"editor":"text","default":"2"},"$preview":{"width":1280,"height":56}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      iniciales: this.props.iniciales ?? 'AR',
      rol: this.props.rol ?? 'A. Ruiz · Ejecutivo comercial',
      alertas: this.props.alertas ?? '2'
    };
  }
}
</script>
</body>
</html>
