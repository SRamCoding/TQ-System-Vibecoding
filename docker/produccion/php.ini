; Producción (plan 1.12b). El techo de subida es el de ValidadorTamanoAdjunto::TECHO_MB (50 MB), igual que nginx y
; Livewire: el parámetro `adjuntos.tamano_maximo_mb` decide por debajo.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 50M
post_max_size = 52M
max_execution_time = 60
date.timezone = America/Lima

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; El código no cambia dentro de un contenedor: una versión nueva es una imagen nueva.
opcache.validate_timestamps = 0
