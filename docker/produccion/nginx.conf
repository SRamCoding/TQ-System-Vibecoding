# Producción (plan 1.12b). Solo HTTP: el certificado, el dominio y si es VPN o HTTPS siguen pendientes con TI
# (docs/decisiones/pendientes.md, «Acceso externo»). Lo que no es un archivo de public/ va a Laravel.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # El techo de subida (ValidadorTamanoAdjunto::TECHO_MB, 50 MB por archivo) más lo que ocupa el resto del formulario:
    # igual que `post_max_size` de php.ini. Una prueba vigila que las tres capas sigan iguales.
    client_max_body_size 52M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Archivos ocultos, antes que cualquier otra regla: nginx usa la primera expresión que coincide.
    location ~ /\.(?!well-known).* { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|webp|svg|ico)$ {
        try_files $uri /index.php?$query_string;
        expires 7d;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_read_timeout 120;
        internal;
    }

    # Ningún otro .php.
    location ~ \.php$ { return 404; }
}
